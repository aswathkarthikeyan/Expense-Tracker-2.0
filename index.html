<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Koko Vault — Salary & Expense Tracker</title>
    <meta name="description" content="Personal income and expense tracker in INR for Stipend and Consulting streams with graphs and breakdown tables." />
    <meta property="og:title" content="Koko Vault — Salary & Expense Tracker" />
    <meta property="og:description" content="Personal income and expense tracker in INR for Stipend and Consulting streams with graphs and breakdown tables." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F6F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Koko" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./koko-bundle.css" />
  </head>
  <body class="bg-[#F6F5F0] text-[#141518] antialiased selection:bg-[#10B981]/20">
    <div id="root"></div>
    <script type="module" data-cfasync="false" src="/src/main.tsx"></script>
    <script data-cfasync="false">
      (function () {
        var booted = false;
        function mountFallback() {
          if (booted || window.__KOKO_MOUNTED__) return;
          var root = document.getElementById('root');
          if (root && root.getAttribute('data-koko-rendered') === 'true') return;
          booted = true;
          var s = document.createElement('script');
          s.setAttribute('data-cfasync', 'false');
          s.src = './koko-bundle.js';
          s.onerror = function () {
            var s2 = document.createElement('script');
            s2.setAttribute('data-cfasync', 'false');
            s2.src = './public/koko-bundle.js';
            document.body.appendChild(s2);
          };
          document.body.appendChild(s);
        }
        window.addEventListener(
          'error',
          function (e) {
            if (e && e.target && e.target.tagName === 'SCRIPT') {
              setTimeout(mountFallback, 10);
            }
          },
          true
        );
        setTimeout(mountFallback, 450);
      })();
    </script>
  </body>
</html>
